<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline QR Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js');
      }
    </script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; text-align: center; margin-top: 20px; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">
    <!-- Print Area (Hidden normally) -->
    <div id="print-area" class="hidden">
        <h1 id="print-title" style="font-size: 36px; font-weight: bold; margin-bottom: 20px; font-family: sans-serif;"></h1>
        <canvas id="master-qr-canvas" style="margin: 0 auto;"></canvas>
    </div>

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold">100% Offline QR App</h1>
        <span id="status-indicator" class="bg-green-500 text-xs px-2 py-1 rounded font-bold">Ready</span>
    </header>

    <!-- SCREEN 1: DASHBOARD -->
    <div id="screen-dashboard" class="max-w-md mx-auto p-4 space-y-6 mt-10">
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-500">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Create / Select Box</h2>
            <p class="text-gray-600 text-sm mb-4">Enter a box number to start scanning tags into it.</p>
            <input type="text" id="box-name" placeholder="e.g., Box 1, Box 2" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 font-bold text-blue-700 mb-6">
            <button onclick="goToScanner()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold text-xl hover:bg-blue-700 transition shadow">
                Start Scanning &rarr;
            </button>
        </div>
        
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-lg font-bold mb-4 text-gray-800">Database Management</h2>
            <p class="text-gray-600 text-sm mb-4">Total Scans Saved: <span id="total-scans-badge" class="font-bold text-blue-600">0</span></p>
            <button onclick="exportCSV()" class="w-full bg-gray-800 text-white py-3 rounded-lg font-bold hover:bg-gray-900 transition flex justify-center items-center shadow">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Export All Data (CSV)
            </button>
            <button onclick="clearDatabase()" class="mt-4 w-full bg-red-100 text-red-700 py-2 rounded font-bold border border-red-300">
                Clear All Data
            </button>
        </div>
    </div>

    <!-- SCREEN 2: SCANNER -->
    <div id="screen-scanner" class="hidden max-w-4xl mx-auto p-4 space-y-6 mt-4">
        
        <div class="flex justify-between items-center mb-2">
            <button onclick="goToDashboard()" class="text-blue-600 font-bold hover:underline inline-flex items-center">
                &larr; Back to Boxes
            </button>
        </div>

        <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg shadow-sm">
            <p class="text-gray-700 text-sm">Currently Scanning Into:</p>
            <p class="text-2xl font-bold text-blue-800" id="display-current-box">Box 1</p>
        </div>

        <!-- Scanner Section -->
        <div class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-lg font-bold mb-2 border-b pb-1">1. Live Scanner</h2>
            <div id="reader" class="w-full bg-black rounded overflow-hidden"></div>
            <button id="start-scan-btn" onclick="startScanner()" class="mt-4 w-full bg-blue-600 text-white py-3 rounded font-bold flex justify-center items-center">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                Open Camera
            </button>
        </div>

        <!-- Manual Entry Section -->
        <div class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-lg font-bold mb-2 border-b pb-1">2. Review & Add</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Scanned QR Data (TID)</label>
                    <input type="text" id="input-qr" class="mt-1 w-full border border-gray-300 rounded px-3 py-2 bg-gray-50" placeholder="Scan above or type here...">
                </div>
                <div>
                    <label class="block text-sm font-bold text-blue-700">Quantity</label>
                    <input type="number" id="input-quantity" class="mt-1 w-full border-2 border-blue-400 rounded px-3 py-3 text-xl font-bold bg-blue-50" placeholder="Enter quantity...">
                </div>
                <button onclick="saveItem()" class="w-full bg-green-600 text-white py-4 rounded-lg font-bold text-xl shadow hover:bg-green-700 transition">
                    SAVE TO PHONE
                </button>
            </div>
        </div>

        <!-- Local Database Section (Current Box) -->
        <div class="bg-white p-4 rounded-lg shadow">
            <div class="flex justify-between items-center mb-2 border-b pb-1">
                <h2 class="text-lg font-bold">Items in <span id="table-box-name">Box 1</span></h2>
                <button onclick="printBoxQR()" class="bg-blue-600 text-white px-3 py-1 rounded text-sm font-bold flex items-center shadow hover:bg-blue-700">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Print QR Code
                </button>
            </div>
            
            <div class="overflow-x-auto mt-4">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-2 border">QR Data</th>
                            <th class="p-2 border">Qty</th>
                            <th class="p-2 border">Time</th>
                            <th class="p-2 border">Action</th>
                        </tr>
                    </thead>
                    <tbody id="db-table-body">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let html5QrcodeScanner = null;
        let currentBox = "";

        // Initialize Database from LocalStorage
        let localDB = JSON.parse(localStorage.getItem('offline_qr_db')) || [];
        
        // Load Settings on Boot
        document.getElementById('box-name').value = localStorage.getItem('current_box') || '';
        updateDashboardStats();

        function updateDashboardStats() {
            document.getElementById('total-scans-badge').innerText = localDB.length;
        }

        // SPA Navigation
        function goToScanner() {
            const boxInput = document.getElementById('box-name').value.trim();
            if (!boxInput) {
                alert("Please enter a Box name first!");
                return;
            }
            currentBox = boxInput;
            localStorage.setItem('current_box', currentBox);
            
            document.getElementById('display-current-box').innerText = currentBox;
            document.getElementById('table-box-name').innerText = currentBox;
            
            document.getElementById('screen-dashboard').classList.add('hidden');
            document.getElementById('screen-scanner').classList.remove('hidden');
            
            renderTable();
        }

        function printBoxQR() {
            const boxItems = localDB.filter(item => item.box === currentBox);
            
            if (boxItems.length === 0) {
                alert("Box is empty! Please scan items first.");
                return;
            }

            let totalQty = 0;
            let itemList = "";

            boxItems.forEach(item => {
                totalQty += parseInt(item.qty, 10) || 0;
                itemList += `${item.qr} : ${item.qty}\n`;
            });

            let qrText = `Box: ${currentBox}\nUnique TIDs: ${boxItems.length}\nTotal Qty: ${totalQty}\n---\n${itemList}`;
            
            if (qrText.length > 2000) {
                qrText = qrText.substring(0, 2000) + "\n...[TRUNCATED]";
            }

            // Draw QR on hidden print canvas
            const qr = new QRious({
                element: document.getElementById('master-qr-canvas'),
                value: qrText,
                size: 300,
                level: 'L'
            });

            // Set Title
            document.getElementById('print-title').innerText = currentBox;

            // Trigger Print Dialog
            document.getElementById('print-area').classList.remove('hidden');
            window.print();
            
            // Hide Print Area after print dialog closes (timeout to allow render)
            setTimeout(() => {
                document.getElementById('print-area').classList.add('hidden');
            }, 1000);
        }

        function goToDashboard() {
            // Stop scanner if running
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                html5QrcodeScanner.stop().catch(err => console.log(err));
                document.getElementById('start-scan-btn').style.display = 'flex';
                document.getElementById('start-scan-btn').innerText = "Open Camera";
            }
            
            document.getElementById('screen-scanner').classList.add('hidden');
            document.getElementById('screen-dashboard').classList.remove('hidden');
            updateDashboardStats();
        }

        function startScanner() {
            document.getElementById('start-scan-btn').style.display = 'none';
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => {
                alert("Camera error. Please allow camera permissions.");
                document.getElementById('start-scan-btn').style.display = 'flex';
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            html5QrcodeScanner.stop().then(() => {
                document.getElementById('start-scan-btn').style.display = 'flex';
                document.getElementById('start-scan-btn').innerText = "Scan Another Tag";
                
                document.getElementById('input-qr').value = decodedText;
                
                if (navigator.vibrate) navigator.vibrate(200);
                
                document.getElementById('input-quantity').focus();
            });
        }

        function saveItem() {
            const qr = document.getElementById('input-qr').value.trim();
            const qty = document.getElementById('input-quantity').value.trim();

            if (!qr || !qty) {
                alert("Please scan a QR and enter a quantity!");
                return;
            }

            const isDuplicate = localDB.some(item => item.qr === qr && item.box === currentBox);
            if (isDuplicate) {
                alert("DUPLICATE WARNING: This QR code is already in this box!");
                return;
            }

            const newItem = {
                id: Date.now(),
                box: currentBox,
                qr: qr,
                qty: qty,
                timestamp: new Date().toLocaleString()
            };

            localDB.unshift(newItem); 
            localStorage.setItem('offline_qr_db', JSON.stringify(localDB));
            
            document.getElementById('input-qr').value = '';
            document.getElementById('input-quantity').value = '';
            
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('db-table-body');
            tbody.innerHTML = '';
            
            // Only show items for CURRENT BOX
            const boxItems = localDB.filter(item => item.box === currentBox);
            
            if (boxItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">No items in ${currentBox} yet.</td></tr>`;
                return;
            }

            boxItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2 border text-blue-600 font-mono text-xs">${item.qr}</td>
                    <td class="p-2 border font-bold text-green-600">${item.qty}</td>
                    <td class="p-2 border text-xs text-gray-500">${item.timestamp}</td>
                    <td class="p-2 border text-center">
                        <button onclick="deleteItem(${item.id})" class="text-red-500 font-bold px-2">&times;</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteItem(id) {
            if(confirm("Delete this item?")) {
                localDB = localDB.filter(item => item.id !== id);
                localStorage.setItem('offline_qr_db', JSON.stringify(localDB));
                renderTable();
                updateDashboardStats();
            }
        }

        function clearDatabase() {
            if(confirm("WARNING: This will permanently delete ALL data from your phone. Have you exported the CSV first?")) {
                localDB = [];
                localStorage.setItem('offline_qr_db', JSON.stringify(localDB));
                updateDashboardStats();
                document.getElementById('box-name').value = '';
                localStorage.removeItem('current_box');
                alert("Database cleared.");
            }
        }

        function exportCSV() {
            if (localDB.length === 0) {
                alert("Database is empty!");
                return;
            }
            
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Box Name,QR Data (TID),Quantity,Scan Time\n";
            
            localDB.forEach(row => {
                const cleanBox = row.box.replace(/,/g, "");
                const cleanQR = row.qr.replace(/,/g, "");
                csvContent += `${cleanBox},${cleanQR},${row.qty},${row.timestamp}\n`;
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Factory_Scan_Data_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Offline Status Monitor
        window.addEventListener('online', () => document.getElementById('status-indicator').innerText = "Online");
        window.addEventListener('offline', () => {
            const ind = document.getElementById('status-indicator');
            ind.innerText = "OFFLINE MODE";
            ind.classList.replace('bg-green-500', 'bg-yellow-500');
        });
        if (!navigator.onLine) {
            const ind = document.getElementById('status-indicator');
            ind.innerText = "OFFLINE MODE";
            ind.classList.replace('bg-green-500', 'bg-yellow-500');
        }
    </script>
</body>
</html>
