    <script>

        // IndexedDB wrapper for unlimited Master Data storage
        const dbPromise = new Promise((resolve, reject) => {
            if (typeof indexedDB === 'undefined' || !indexedDB) {
                resolve(null);
                return;
            }
            try {
                const request = indexedDB.open('OfflineQR_DB', 1);
                request.onupgradeneeded = (e) => {
                    e.target.result.createObjectStore('store');
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => resolve(null);
            } catch(e) {
                resolve(null);
            }
        });

        async function saveMasterData(data) {
            const db = await dbPromise;
            if (!db) {
                try { localStorage.setItem('master_tickets', JSON.stringify(data)); } catch(e) { alert("Phone memory full. Cannot save."); }
                return;
            }
            return new Promise((resolve) => {
                try {
                    const tx = db.transaction('store', 'readwrite');
                    tx.objectStore('store').put(data, 'master_tickets');
                    tx.oncomplete = resolve;
                    tx.onerror = resolve;
                } catch(e) { resolve(); }
            });
        }

        async function getMasterData() {
            const db = await dbPromise;
            if (!db) return null;
            return new Promise((resolve) => {
                try {
                    const tx = db.transaction('store', 'readonly');
                    const req = tx.objectStore('store').get('master_tickets');
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                } catch(e) { resolve(null); }
            });
        }

try {

        async function updateSyncSummary() {
            try {
                let masterData = await getMasterData();
                if (!masterData) {
                    const lsData = localStorage.getItem('master_tickets');
                    if (lsData) masterData = JSON.parse(lsData);
                }
                
                if (masterData) {
                    const keys = Object.keys(masterData);
                    const summaryDiv = document.getElementById('sync-data-summary');
                    
                    if (keys.length > 0) {
                        summaryDiv.classList.remove('hidden');
                        document.getElementById('sync-summary-text').innerText = `${keys.length} Master Tickets Ready`;
                        
                        let detailsHtml = '<div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="bg-indigo-100"><th class="p-1 border-b">TID</th><th class="p-1 border-b">Style</th><th class="p-1 border-b">Color</th><th class="p-1 border-b">Size</th><th class="p-1 border-b">Qty</th></tr></thead><tbody>';
                        
                        // Only show first 100 to prevent lagging the UI
                        const previewKeys = keys.slice(0, 100);
                        previewKeys.forEach(k => {
                            const t = masterData[k];
                            detailsHtml += `<tr>
                                <td class="p-1 border-b font-mono">${k}</td>
                                <td class="p-1 border-b truncate max-w-[80px]">${t.style || '-'}</td>
                                <td class="p-1 border-b">${t.color || '-'}</td>
                                <td class="p-1 border-b">${t.size || '-'}</td>
                                <td class="p-1 border-b font-bold">${t.quantity || '-'}</td>
                            </tr>`;
                        });
                        
                        if (keys.length > 100) {
                            detailsHtml += `<tr><td colspan="5" class="p-2 text-center text-gray-500 italic">...and ${keys.length - 100} more tickets hidden</td></tr>`;
                        }
                        
                        detailsHtml += '</tbody></table></div>';
                        document.getElementById('sync-details').innerHTML = detailsHtml;
                    } else {
                        summaryDiv.classList.add('hidden');
                    }
                }
            } catch(e) {
                console.error(e);
            }
        }

        function updateDashboardStats() {
            document.getElementById('total-scans-badge').innerText = localDB.length;
            
            const listContainer = document.getElementById('dashboard-box-list');
            listContainer.innerHTML = '';
            
            const boxMap = {};
            localDB.forEach(item => {
                if (!boxMap[item.box]) { boxMap[item.box] = 0; }
                boxMap[item.box]++;
            });
            
            const uniqueBoxes = Object.keys(boxMap).sort((a,b) => b.localeCompare(a));
            
            if (uniqueBoxes.length === 0) {
                listContainer.innerHTML = `<p class="text-gray-500 text-sm italic">${i18n[currentLang]["no_boxes"]}</p>`;
                return;
            }
            
            uniqueBoxes.forEach(box => {
                const count = boxMap[box];
                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-3 bg-gray-50 border rounded";
                div.innerHTML = `
                    <div>
                        <p class="font-bold text-blue-800">${box}</p>
                        <p class="text-xs text-gray-600">${count} <span data-i18n="items_scanned"></span></p>
                    </div>
                    <button onclick="resumeBox('${box}')" class="bg-blue-100 text-blue-700 px-4 py-2 rounded text-sm font-bold border border-blue-300 hover:bg-blue-200">
                        Open
                    </button>
                `;
                listContainer.appendChild(div);
            });

            // Render Global History Table
            const tbody = document.getElementById('global-history-body');
            tbody.innerHTML = '';
            if (localDB.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">${i18n[currentLang]["no_items_history"]}</td></tr>`;
            } else {
                localDB.forEach(item => {
                    const statusHtml = item.synced 
                        ? `<span class="text-green-600 font-bold">${i18n[currentLang]["synced"]}</span>` 
                        : `<span class="text-yellow-600 font-bold">${i18n[currentLang]["pending"]}</span>`;
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="p-2 border font-bold text-gray-700">${item.box}</td>
                        <td class="p-2 border text-blue-600 font-mono text-xs">${item.qr}</td>
                        <td class="p-2 border font-bold text-green-600">${item.qty}</td>
                        <td class="p-2 border text-xs text-gray-500">${item.timestamp}</td>
                        <td class="p-2 border text-xs text-center">${statusHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        // SPA Navigation
        function createNewBox() {
            const today = new Date().toLocaleDateString(); 
            const existingBoxes = [...new Set(localDB.map(item => item.box))];
            
            let maxSeq = 0;
            existingBoxes.forEach(b => {
                if (b.includes(today)) {
                    const match = b.match(/Box (\d+)/);
                    if (match && match[1]) {
                        const num = parseInt(match[1]);
                        if (num > maxSeq) maxSeq = num;
                    }
                }
            });
            
            const nextSeq = maxSeq + 1;
            const newBoxName = `Box ${nextSeq} - ${today}`;
            
            resumeBox(newBoxName);
        }

        function resumeBox(boxName) {
            currentBox = boxName;
            localStorage.setItem('current_box', currentBox);
            
            document.getElementById('display-current-box').innerText = currentBox;
            document.getElementById('table-box-name').innerText = currentBox;
            
            document.getElementById('screen-dashboard').classList.add('hidden');
            document.getElementById('screen-scanner').classList.remove('hidden');
            
            renderTable();
        }

        function printBoxQR() {
            const boxItems = localDB.filter(item => item.box === currentBox);
            
            if (boxItems.length === 0) {
                alert("Box is empty! Please scan items first.");
                return;
            }

            let totalQty = 0;
            let itemList = "";

            boxItems.forEach(item => {
                totalQty += parseInt(item.qty, 10) || 0;
                if (item.tid && item.style !== "-") {
                    itemList += `TID:${item.tid} | ${item.color} | ${item.size} => Qty: ${item.qty}\n`;
                } else {
                    itemList += `${item.qr} => Qty: ${item.qty}\n`;
                }
            });

            let qrText = `Box: ${currentBox}\nUnique TIDs: ${boxItems.length}\nTotal Qty: ${totalQty}\n---\n${itemList}`;
            
            if (qrText.length > 2000) {
                qrText = qrText.substring(0, 2000) + "\n...[TRUNCATED]";
            }

            // Draw QR on hidden print canvas
            const qr = new QRious({
                element: document.getElementById('master-qr-canvas'),
                value: qrText,
                size: 300,
                level: 'L'
            });

            // Set Title
            document.getElementById('print-title').innerText = currentBox;

            // Trigger Print Dialog
            document.getElementById('print-area').classList.remove('hidden');
            window.print();
            
            // Hide Print Area after print dialog closes (timeout to allow render)
            setTimeout(() => {
                document.getElementById('print-area').classList.add('hidden');
            }, 1000);
        }

        function goToDashboard() {
            // Stop scanner if running
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                html5QrcodeScanner.stop().catch(err => console.log(err));
                document.getElementById('start-scan-btn').style.display = 'flex';
                document.getElementById('start-scan-btn').innerText = i18n[currentLang]["open_camera"];
            }
            
            document.getElementById('screen-scanner').classList.add('hidden');
            document.getElementById('screen-dashboard').classList.remove('hidden');
            updateDashboardStats();
        }

        // --- Qiaofei Data Sync Logic ---
        document.getElementById('sync-master-btn').addEventListener('click', async () => {
            const btn = document.getElementById('sync-master-btn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="i18n" data-en="Syncing..." data-zh="同步中...">Syncing...</span>';
            btn.disabled = true;
            
            try {
                            const timeframe = document.getElementById('sync-timeframe') ? document.getElementById('sync-timeframe').value : 'month';
            const response = await fetch(`/api/sync_qiaofei?timeframe=${timeframe}`, {
                    method: 'POST',
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        
                    // Save to IndexedDB to bypass the 5MB browser limit
                    await saveMasterData(data.tickets);
                    
                    // Clear the old localStorage to free up space
                    localStorage.removeItem('master_tickets');

                        updateSyncSummary();
                        alert(`Successfully synced ${data.total_tickets} tickets from Qiaofei!`);
                    } else {
                        alert("Error: " + data.error);
                    }
                } else {
                    const errText = await response.text(); alert("Server Error " + response.status + ": " + errText);
                }
            } catch (err) {
                alert("Network error: " + err.message);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                setLanguage(currentLang);
            }
        });

        // --- Start New Box Logic ---
        function startScanner() {
            document.getElementById('start-scan-btn').style.display = 'none';
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => {
                alert("Camera error. Please allow camera permissions.");
                document.getElementById('start-scan-btn').style.display = 'flex';
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            html5QrcodeScanner.stop().then(() => {
                document.getElementById('start-scan-btn').style.display = 'flex';
                document.getElementById('start-scan-btn').innerText = i18n[currentLang]["scan_another"];
                
                document.getElementById('input-qr').value = decodedText;
                
                if (navigator.vibrate) navigator.vibrate(200);
                
                // Lookup Qiaofei Master Data to auto-fill quantity
                let autoFilled = false;
                let match = decodedText.match(/tid=(\d+)/);
                if (match) {
                    let tid = match[1];
                    try {
                        const masterDataStr = localStorage.getItem('master_tickets');
                        if (masterDataStr) {
                            const masterData = JSON.parse(masterDataStr);
                            if (masterData[tid] && masterData[tid].quantity) {
                                document.getElementById('input-quantity').value = masterData[tid].quantity;
                                autoFilled = true;
                            }
                        }
                    } catch (e) {}
                }
                
                if (autoFilled) {
                    saveItem(); // Auto save if quantity is known
                } else {
                    document.getElementById('input-quantity').focus();
                }
            });
        }

        
        function extractTid(qrText) {
            let match = qrText.match(/tid=(\d+)/i);
            if (match) return match[1];
            // If it's just numbers, assume it is the TID
            if (/^\d+$/.test(qrText.trim())) return qrText.trim();
            return null;
        }

        async function lookupAndDisplayMasterData() {
            const qrText = document.getElementById('input-qr').value.trim();
            const tid = extractTid(qrText);
            
            // Reset fields
            document.getElementById('input-company').value = '';
            document.getElementById('input-style').value = '';
            document.getElementById('input-bed').value = '';
            document.getElementById('input-bundle').value = '';
            document.getElementById('input-color').value = '';
            document.getElementById('input-size').value = '';
            document.getElementById('input-quantity').value = '';
            
            if (tid) {
                try {
                    // Try IndexedDB first
                    let masterData = await getMasterData();
                    
                    // Fallback to localStorage if not found in IndexedDB (for backwards compatibility)
                    if (!masterData) {
                        const lsData = localStorage.getItem('master_tickets');
                        if (lsData) masterData = JSON.parse(lsData);
                    }
                    
                    if (masterData) {
                        const t = masterData[tid];
                        if (t) {
                            document.getElementById('input-company').value = t.company || '';
                            document.getElementById('input-style').value = t.style || '';
                            document.getElementById('input-bed').value = t.bed || '';
                            document.getElementById('input-bundle').value = t.bundle || '';
                            document.getElementById('input-color').value = t.color || '';
                            document.getElementById('input-size').value = t.size || '';
                            document.getElementById('input-quantity').value = t.quantity || '';
                        }
                    }
                } catch(e) { console.error("Error looking up master data:", e); }
            }
        }

        function saveItem() {
            const qr = document.getElementById('input-qr').value.trim();
            const qty = document.getElementById('input-quantity').value.trim();

            if (!qr || !qty) {
                alert("Please scan a QR and enter a quantity!");
                return;
            }

            const isDuplicate = localDB.some(item => item.qr === qr && item.box === currentBox);
            if (isDuplicate) {
                alert("DUPLICATE WARNING: This QR code is already in this box!");
                return;
            }
            
            const tid = extractTid(qr);
            const company = document.getElementById('input-company').value.trim();
            const style = document.getElementById('input-style').value.trim();
            const bed = document.getElementById('input-bed').value.trim();
            const bundle = document.getElementById('input-bundle').value.trim();
            const color = document.getElementById('input-color').value.trim();
            const size = document.getElementById('input-size').value.trim();
            
            // Build extraDetails for table view
            let extraDetails = `<br/><span class="text-[10px] text-gray-500 leading-tight block mt-1">`;
            let parts = [];
            if(style) parts.push(`Style: ${style}`);
            if(color) parts.push(`Color: ${color}`);
            if(size) parts.push(`Size: ${size}`);
            if(bed) parts.push(`Bed: ${bed}`);
            if(bundle) parts.push(`Bundle: ${bundle}`);
            if(company) parts.push(`Company: ${company}`);
            extraDetails += parts.join(' | ') + `</span>`;

            const newItem = {
                id: Date.now(),
                box: currentBox,
                qr: qr,
                tid: tid,
                qty: qty,
                company: company,
                style: style,
                bed: bed,
                bundle: bundle,
                color: color,
                size: size,
                extraDetails: parts.length > 0 ? extraDetails : "",
                timestamp: new Date().toLocaleString(),
                synced: false
            };

            localDB.unshift(newItem); 
            localStorage.setItem('offline_qr_db', JSON.stringify(localDB));
            
            // Clear inputs
            document.getElementById('input-qr').value = '';
            lookupAndDisplayMasterData(); // this clears the rest
            
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('db-table-body');
            tbody.innerHTML = '';
            
            // Only show items for CURRENT BOX
            const boxItems = localDB.filter(item => item.box === currentBox);
            
            if (boxItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">${i18n[currentLang]["no_items_box"]}</td></tr>`;
                return;
            }

            boxItems.forEach(item => {
                const tr = document.createElement('tr');
                const details = item.extraDetails ? item.extraDetails : "";
                tr.innerHTML = `
                    <td class="p-2 border text-blue-600 font-mono text-xs" style="word-break: break-all;">${item.qr}${details}</td>
                    <td class="p-2 border font-bold text-green-600">${item.qty}</td>
                    <td class="p-2 border text-xs text-gray-500">${item.timestamp}</td>
                    <td class="p-2 border text-center">
                        <button onclick="deleteItem(${item.id})" class="text-red-500 font-bold hover:text-red-700">X</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteItem(id) {
            if(confirm("Delete this item?")) {
                localDB = localDB.filter(item => item.id !== id);
                localStorage.setItem('offline_qr_db', JSON.stringify(localDB));
                renderTable();
                updateDashboardStats();
            }
        }

        async function pushToCloud() {
            if (!navigator.onLine) {
                alert("You are currently offline. Please connect to the internet first.");
                return;
            }
            const unsynced = localDB.filter(item => !item.synced);
            if (unsynced.length === 0) {
                alert("All items are already pushed to the cloud!");
                return;
            }
            
            try {
                const btn = document.getElementById('push-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = `<svg class="animate-spin w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Syncing...`;
                
                const response = await fetch('/api/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(unsynced)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.status === "error") {
                        alert("Server Error Details:\n" + data.message);
                        btn.innerHTML = originalText;
                        return;
                    }
                    localDB.forEach(item => { item.synced = true; });
                    localStorage.setItem('offline_qr_db', JSON.stringify(localDB));
                    alert(`Successfully pushed ${unsynced.length} items to the cloud!`);
                    updateDashboardStats();
                } else {
                    const errText = await response.text();
                    alert("Server error. Could not push to cloud.\n\nDetails: " + errText);
                    btn.innerHTML = originalText;
                }
            } catch (e) {
                alert("Network error. Make sure the server is reachable.");
                document.getElementById('push-btn').innerHTML = `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg> <span data-i18n="push_cloud">Push to Cloud Database</span>`;
            }
        }

        function clearDatabase() {
            const unsynced = localDB.filter(item => !item.synced);
            if (unsynced.length > 0) {
                alert(`STOP! You have ${unsynced.length} pending items that have not been pushed to the cloud database.\n\nPlease connect to the internet and click "<span data-i18n="push_cloud">Push to Cloud Database</span>" before clearing your data!`);
                return;
            }
            if(confirm("All data has been safely pushed to the cloud. Are you sure you want to clear the phone's memory to start fresh?")) {
                localDB = [];
                localStorage.setItem('offline_qr_db', JSON.stringify(localDB));
                updateDashboardStats();
                localStorage.removeItem('current_box');
                alert("Database cleared from phone.");
            }
        }

        function exportCSV() {
            if (localDB.length === 0) {
                alert("Database is empty!");
                return;
            }
            
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Box Name,QR Data (TID),Quantity,Scan Time\n";
            
            localDB.forEach(row => {
                const cleanBox = row.box.replace(/,/g, "");
                const cleanQR = row.qr.replace(/,/g, "");
                csvContent += `${cleanBox},${cleanQR},${row.qty},${row.timestamp}\n`;
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Factory_Scan_Data_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Offline Status Monitor
        window.addEventListener('online', () => document.getElementById('status-indicator').innerText = "Online");
        window.addEventListener('offline', () => {
            const ind = document.getElementById('status-indicator');
            ind.innerText = "OFFLINE MODE";
            ind.classList.replace('bg-green-500', 'bg-yellow-500');
        });

        if (!navigator.onLine) {
            const ind = document.getElementById('status-indicator');
            ind.innerText = "OFFLINE MODE";
            ind.classList.replace('bg-green-500', 'bg-yellow-500');
        }
        
        updateSyncSummary();
        // Apply language on startup
        setLanguage(currentLang);

    </script>
</body>
</html>
