<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline QR Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js');
      }
    </script>
</head>
<body class="bg-gray-100 min-h-screen pb-10">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold">100% Offline QR App</h1>
        <span id="status-indicator" class="bg-green-500 text-xs px-2 py-1 rounded font-bold">Ready</span>
    </header>

    <div class="max-w-4xl mx-auto p-4 space-y-6 mt-4">
        
        <!-- Box Selection -->
        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
            <label class="block text-sm font-bold text-gray-700 mb-1">Current Box / Collection Name:</label>
            <input type="text" id="box-name" value="Box 1" class="w-full border-2 border-gray-300 rounded px-3 py-2 font-bold text-blue-700" onchange="saveSettings()">
        </div>

        <!-- Scanner Section -->
        <div class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-lg font-bold mb-2 border-b pb-1">1. Live Scanner</h2>
            <div id="reader" class="w-full bg-black rounded overflow-hidden"></div>
            <button id="start-scan-btn" onclick="startScanner()" class="mt-4 w-full bg-blue-600 text-white py-3 rounded font-bold flex justify-center items-center">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                Open Camera
            </button>
        </div>

        <!-- Manual Entry Section -->
        <div class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-lg font-bold mb-2 border-b pb-1">2. Review & Add</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Scanned QR Data (TID)</label>
                    <input type="text" id="input-qr" class="mt-1 w-full border border-gray-300 rounded px-3 py-2 bg-gray-50" placeholder="Scan above or type here...">
                </div>
                <div>
                    <label class="block text-sm font-bold text-blue-700">Quantity</label>
                    <input type="number" id="input-quantity" class="mt-1 w-full border-2 border-blue-400 rounded px-3 py-3 text-xl font-bold bg-blue-50" placeholder="Enter quantity...">
                </div>
                <button onclick="saveItem()" class="w-full bg-green-600 text-white py-4 rounded-lg font-bold text-xl shadow hover:bg-green-700 transition">
                    SAVE TO PHONE
                </button>
            </div>
        </div>

        <!-- Local Database Section -->
        <div class="bg-white p-4 rounded-lg shadow">
            <div class="flex justify-between items-center mb-2 border-b pb-1">
                <h2 class="text-lg font-bold">3. Phone Database</h2>
                <button onclick="exportCSV()" class="bg-gray-800 text-white px-3 py-1 rounded text-sm font-bold flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Export CSV
                </button>
            </div>
            
            <div class="overflow-x-auto mt-4">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-2 border">Box</th>
                            <th class="p-2 border">QR Data</th>
                            <th class="p-2 border">Qty</th>
                            <th class="p-2 border">Time</th>
                            <th class="p-2 border">Action</th>
                        </tr>
                    </thead>
                    <tbody id="db-table-body">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
            <button onclick="clearDatabase()" class="mt-4 w-full bg-red-100 text-red-700 py-2 rounded text-sm font-bold border border-red-300">
                Clear All Data
            </button>
        </div>

    </div>

    <script>
        let html5QrcodeScanner = null;

        // Initialize Database from LocalStorage
        let localDB = JSON.parse(localStorage.getItem('offline_qr_db')) || [];
        
        // Load Settings
        document.getElementById('box-name').value = localStorage.getItem('current_box') || 'Box 1';

        function saveSettings() {
            localStorage.setItem('current_box', document.getElementById('box-name').value);
        }

        function startScanner() {
            document.getElementById('start-scan-btn').style.display = 'none';
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => {
                alert("Camera error. Please allow camera permissions.");
                document.getElementById('start-scan-btn').style.display = 'flex';
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Stop scanner to save battery
            html5QrcodeScanner.stop().then(() => {
                document.getElementById('start-scan-btn').style.display = 'flex';
                document.getElementById('start-scan-btn').innerText = "Scan Another Tag";
                
                // Fill form
                document.getElementById('input-qr').value = decodedText;
                
                // Vibrate if mobile
                if (navigator.vibrate) navigator.vibrate(200);
                
                // Focus quantity
                document.getElementById('input-quantity').focus();
            });
        }

        function saveItem() {
            const qr = document.getElementById('input-qr').value.trim();
            const qty = document.getElementById('input-quantity').value.trim();
            const box = document.getElementById('box-name').value.trim();

            if (!qr || !qty) {
                alert("Please scan a QR and enter a quantity!");
                return;
            }

            // Deduplication Check
            const isDuplicate = localDB.some(item => item.qr === qr && item.box === box);
            if (isDuplicate) {
                alert("DUPLICATE WARNING: This QR code is already in this box!");
                return;
            }

            const newItem = {
                id: Date.now(),
                box: box,
                qr: qr,
                qty: qty,
                timestamp: new Date().toLocaleString()
            };

            localDB.unshift(newItem); // Add to top
            localStorage.setItem('offline_qr_db', JSON.stringify(localDB));
            
            // Clear form
            document.getElementById('input-qr').value = '';
            document.getElementById('input-quantity').value = '';
            
            alert("✅ Saved to Phone successfully!");
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('db-table-body');
            tbody.innerHTML = '';
            
            if (localDB.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No items saved yet.</td></tr>`;
                return;
            }

            localDB.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2 border font-bold">${item.box}</td>
                    <td class="p-2 border text-blue-600 font-mono text-xs">${item.qr}</td>
                    <td class="p-2 border font-bold text-green-600">${item.qty}</td>
                    <td class="p-2 border text-xs text-gray-500">${item.timestamp}</td>
                    <td class="p-2 border text-center">
                        <button onclick="deleteItem(${item.id})" class="text-red-500 font-bold px-2">&times;</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteItem(id) {
            if(confirm("Delete this item?")) {
                localDB = localDB.filter(item => item.id !== id);
                localStorage.setItem('offline_qr_db', JSON.stringify(localDB));
                renderTable();
            }
        }

        function clearDatabase() {
            if(confirm("WARNING: This will permanently delete ALL data from your phone. Have you exported the CSV first?")) {
                localDB = [];
                localStorage.setItem('offline_qr_db', JSON.stringify(localDB));
                renderTable();
            }
        }

        function exportCSV() {
            if (localDB.length === 0) {
                alert("Database is empty!");
                return;
            }
            
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Box Name,QR Data (TID),Quantity,Scan Time\n";
            
            localDB.forEach(row => {
                const cleanBox = row.box.replace(/,/g, "");
                const cleanQR = row.qr.replace(/,/g, "");
                csvContent += `${cleanBox},${cleanQR},${row.qty},${row.timestamp}\n`;
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Factory_Scan_Data_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initial render
        renderTable();

        // Offline Status Monitor
        window.addEventListener('online', () => document.getElementById('status-indicator').innerText = "Online");
        window.addEventListener('offline', () => {
            const ind = document.getElementById('status-indicator');
            ind.innerText = "OFFLINE MODE";
            ind.classList.replace('bg-green-500', 'bg-yellow-500');
        });
        if (!navigator.onLine) {
            const ind = document.getElementById('status-indicator');
            ind.innerText = "OFFLINE MODE";
            ind.classList.replace('bg-green-500', 'bg-yellow-500');
        }
    </script>
</body>
</html>
