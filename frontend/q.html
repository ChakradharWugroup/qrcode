<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // CHANGE THIS TO YOUR URL IN PRODUCTION
        const API_BASE_URL = "https://qrcode-production-dbd4.up.railway.app";
        const urlParams = new URLSearchParams(window.location.search);
        const collectionId = urlParams.get('id');

        async function loadCollection() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/collections/${collectionId}`);
                if (!res.ok) {
                    document.body.innerHTML = '<div class="p-8 text-center text-gray-500">Collection not found</div>';
                    return;
                }
                const collection = await res.json();
                
                document.getElementById('header-title').innerText = collection.name;
                document.getElementById('header-count').innerText = collection.qr_codes.length + " Items";
                
                const list = document.getElementById('item-list');
                list.innerHTML = '';

                if (collection.qr_codes.length === 0) {
                    list.innerHTML = '<div class="text-center p-8 bg-white rounded-lg shadow-sm"><p class="text-gray-500">This collection is empty.</p></div>';
                } else {
                    collection.qr_codes.forEach((qr, index) => {
                        let totalBundlesHtml = qr.total_bundles ? `<div><span class="font-medium text-gray-800">Total Bundles:</span> ${qr.total_bundles}</div>` : '';
                        let totalQtyHtml = qr.total_quantity ? `<div><span class="font-medium text-gray-800">Total Qty:</span> ${qr.total_quantity}</div>` : '';
                        
                        list.innerHTML += `
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                            <div class="flex justify-between items-start border-b pb-3 mb-3">
                                <h2 class="text-lg font-bold text-gray-800">
                                    <span class="text-blue-600 mr-1">${index + 1}.</span> 
                                    Style: ${qr.style_no}
                                </h2>
                                <span class="bg-gray-100 text-gray-600 text-xs font-mono px-2 py-1 rounded">Size: ${qr.size}</span>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-y-2 text-sm text-gray-600 mb-4">
                                <div><span class="font-medium text-gray-800">Company:</span> ${qr.company_name}</div>
                                <div><span class="font-medium text-gray-800">Color:</span> ${qr.color}</div>
                                <div><span class="font-medium text-gray-800">Bed No:</span> ${qr.bed_no}</div>
                                <div><span class="font-medium text-gray-800">Bundle No:</span> ${qr.bundle_no}</div>
                                <div><span class="font-medium text-blue-700">Quantity:</span> ${qr.quantity}</div>
                                ${totalBundlesHtml}
                                ${totalQtyHtml}
                            </div>

                            <div class="bg-gray-50 p-3 rounded text-sm break-all font-mono">
                                <span class="text-gray-500 block mb-1 uppercase text-xs font-bold">QR Data / URL:</span>
                                <a href="${qr.qr_data}" target="_blank" class="text-blue-600 hover:underline">${qr.qr_data}</a>
                            </div>
                        </div>
                        `;
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        window.onload = loadCollection;
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 id="header-title" class="text-xl font-bold truncate">Loading...</h1>
            <span id="header-count" class="bg-blue-800 text-xs px-2 py-1 rounded">... Items</span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 py-8">
        <p class="text-gray-600 mb-6 text-center">You have scanned the Master QR. Here are the contents of this collection:</p>
        <div id="item-list" class="space-y-6"></div>
    </main>
</body>
</html>
